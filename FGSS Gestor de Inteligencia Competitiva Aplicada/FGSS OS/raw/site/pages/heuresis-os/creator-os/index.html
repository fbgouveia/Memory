<!doctype html>
<html lang="en">

      </div>

      <nav class="nav" id="nav">
        <div class="nav-h">Content Creation</div>
        <a href="#/dashboard" data-route="dashboard">Dashboard</a>
        <a href="#/inbox" data-route="inbox">Inbox <span class="badge" id="nav-inbox"></span></a>
        <a href="#/platforms" data-route="platforms">Platforms</a>

    <div class="modal">
      <div class="modal-head"><h3 id="modal-title"></h3><button class="x" id="modal-x" aria-label="close">✕</button></div>
      <form id="modal-form"></form>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>
  <script src="/heuresis-os/heuresis-shim.js"></script>
